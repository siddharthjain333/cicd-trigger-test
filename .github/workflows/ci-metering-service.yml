name: CI - metering-service

on:
  push:
    branches: [dev, main]
    paths:
      - 'services/metering-service/**'
      - 'deployment/services/metering-service/**'
      - '.github/workflows/ci-metering-service.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'services/metering-service/**'
  workflow_dispatch:

env:
  SERVICE_DIR: services/metering-service
  ACR_NAME: kuriouscr001
  ACR_IMAGE: kuriouscr001.azurecr.io/kurious-ns/metering-service
  APP_LABEL: metering-service-app
  DEV_MANIFEST: deployment/services/metering-service/dev/deployment.yaml
  PROD_MANIFEST: deployment/services/metering-service/deployment.yaml
  DEV_NAMESPACE: kurious-dev
  PROD_NAMESPACE: kurious

jobs:
  # ── Code Review — runs on every PR ────────────────────────────────────────
  code-review:
    name: Lint → Test → Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: ${{ env.SERVICE_DIR }}

      - name: Black — formatting check
        run: black --check --diff .
        working-directory: ${{ env.SERVICE_DIR }}

      - name: Flake8 — lint
        run: flake8 . --max-line-length=100 --exclude=.git,__pycache__,alembic
        working-directory: ${{ env.SERVICE_DIR }}

      - name: Pytest — unit tests
        run: pytest -m "not integration and not slow" --tb=short
        working-directory: ${{ env.SERVICE_DIR }}

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ env.SERVICE_DIR }}

      - name: Build image for scan
        run: docker build -t metering-service:scan ${{ env.SERVICE_DIR }}

      - name: Trivy — scan image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: metering-service:scan
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

  # ── Deploy Dev — runs on push to dev ──────────────────────────────────────
  deploy-dev:
    name: Build → Push → Deploy (Dev)
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          TAG="$(date +'%Y%m%d')_v${{ github.run_number }}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "IMAGE=${{ env.ACR_IMAGE }}:$TAG" >> $GITHUB_ENV

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ env.IMAGE }} \
            --push \
            ${{ env.SERVICE_DIR }}

      - name: Update image tag in deployment YAML
        run: |
          sed -i "s|image: ${{ env.ACR_IMAGE }}:.*|image: ${{ env.IMAGE }}|g" \
            ${{ env.DEV_MANIFEST }}
          echo "Updated manifest:"
          grep "image:" ${{ env.DEV_MANIFEST }}

      - name: Install kubelogin
        run: az aks install-cli

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group kurious-rg-dev \
            --name aks-kurious-dev \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Apply Kubernetes manifest
        run: kubectl apply -f ${{ env.DEV_MANIFEST }}

      - name: Rollout restart
        run: kubectl rollout restart deployment/${{ env.APP_LABEL }} -n ${{ env.DEV_NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.APP_LABEL }} \
            -n ${{ env.DEV_NAMESPACE }} --timeout=300s

      - name: Deployment summary
        run: |
          echo "=========================================="
          echo "  DEV DEPLOYMENT COMPLETE"
          echo "  Image: ${{ env.IMAGE }}"
          echo "  Cluster: aks-kurious-dev"
          echo "  Namespace: ${{ env.DEV_NAMESPACE }}"
          echo "=========================================="
          kubectl get pods -n ${{ env.DEV_NAMESPACE }} -l app=${{ env.APP_LABEL }}

  # ── Deploy Prod — runs on push to main ────────────────────────────────────
  deploy-prod:
    name: Build → Push → Deploy (Prod)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          TAG="$(date +'%Y%m%d')_v${{ github.run_number }}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "IMAGE=${{ env.ACR_IMAGE }}:$TAG" >> $GITHUB_ENV

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ env.IMAGE }} \
            --push \
            ${{ env.SERVICE_DIR }}

      - name: Update image tag in deployment YAML
        run: |
          sed -i "s|image: ${{ env.ACR_IMAGE }}:.*|image: ${{ env.IMAGE }}|g" \
            ${{ env.PROD_MANIFEST }}
          echo "Updated manifest:"
          grep "image:" ${{ env.PROD_MANIFEST }}

      - name: Install kubelogin
        run: az aks install-cli

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group kurious-rg-dev \
            --name aks-kurious-dev \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Apply Kubernetes manifest
        run: kubectl apply -f ${{ env.PROD_MANIFEST }}

      - name: Rollout restart
        run: kubectl rollout restart deployment/${{ env.APP_LABEL }} -n ${{ env.PROD_NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.APP_LABEL }} \
            -n ${{ env.PROD_NAMESPACE }} --timeout=300s

      - name: Verify pod health
        run: |
          kubectl get pods -n ${{ env.PROD_NAMESPACE }} -l app=${{ env.APP_LABEL }}
          kubectl wait --for=condition=ready pod \
            -l app=${{ env.APP_LABEL }} \
            -n ${{ env.PROD_NAMESPACE }} --timeout=300s

      - name: Deployment summary
        run: |
          echo "=========================================="
          echo "  PROD DEPLOYMENT COMPLETE"
          echo "  Image: ${{ env.IMAGE }}"
          echo "  Cluster: aks-kurious-dev"
          echo "  Namespace: ${{ env.PROD_NAMESPACE }}"
          echo "=========================================="
          kubectl get pods -n ${{ env.PROD_NAMESPACE }} -l app=${{ env.APP_LABEL }}
